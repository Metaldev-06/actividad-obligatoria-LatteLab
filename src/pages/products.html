<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LatteLab - Menú</title>
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />

    <meta
      name="description"
      content="LatteLab es una cafetería que ofrece una experiencia única con café de alta calidad y un ambiente acogedor."
    />
    <meta name="author" content="Fernando Diaz" />

    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/products.css" />
  </head>
  <body>
    <header>
      <div class="header__container">
        <div class="header__logo">
          <img
            src="../assets/images/layout/Coffee.svg"
            alt="Logo de LatteLab"
            loading="eager"
            fetchpriority="high"
          />

          <h1>Latte<span>Lab</span></h1>
        </div>

        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="../../index.html">Inicio</a>
            </li>
            <li class="header__nav-item">
              <a class="active" href="products.html">Menú</a>
            </li>
            <li class="header__nav-item">
              <a href="promotions.html">Promociones</a>
            </li>
            <li class="header__nav-item">
              <a href="about-us.html">Nosotros</a>
            </li>
            <li class="header__nav-item">
              <a href="contact.html">Contacto</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main__section">
      <h2 class="title__section">Nuestro Menú</h2>

      <section class="products__container" id="product-container"></section>
    </main>

    <footer>
      <div class="footer__corner"></div>
      <div class="footer__content">
        <p>
          &copy; 2025 LatteLab. Desarrollado por
          <a href="https://metaldev.com.ar/" target="_blank">Fernando Diaz</a>
        </p>
      </div>
    </footer>

    <template id="template-products">
      <div class="products__card">
        <div class="products__image">
          <img
            src=""
            alt="Café Irlandés"
            class="products__image"
            id="template-card-img"
          />
        </div>

        <div class="products__info">
          <h3 class="products__name" id="template-card-name"></h3>
          <p class="products__description" id="template-card-description"></p>

          <div class="products__info--purchase">
            <span class="products__price" id="template-card-price"></span>

            <button
              class="button__component products__button"
              id="template-card-button"
            >
              Agregar al Carrito
            </button>
          </div>
        </div>
      </div>
    </template>

    <script src="../js/products.js" type="module"></script>
  </body>
</html>
